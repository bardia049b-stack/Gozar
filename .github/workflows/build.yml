name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: GozarWG

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is missing - refusing to build an unsigned release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          set -e
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/" | tr -d ' ')
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" .apk)
            case "$b" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *x86*) abi=x86 ;;
              *universal*) abi=universal ;;
              *) abi=universal ;;
            esac
            cp "$f" "out/GozarWG_${VERSION}_${abi}.apk"
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Package
        run: bash ./gradlew :desktop:createDistributable :desktop:packageDeb --no-daemon --stacktrace

      - name: Verify architecture
        run: |
          set -e
          VERSION=$(grep -m1 'packageVersion' desktop/build.gradle | sed -E "s/.*'([^']+)'.*/\1/" | tr -d ' ')
          DEB=$(ls desktop/build/compose/binaries/main/deb/*.deb | head -1)
          rm -rf "$RUNNER_TEMP/deb"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/deb"
          python3 scripts/arch_check.py "$RUNNER_TEMP/deb" x86_64
          file "$DEB" | grep -q "Debian binary package" || { echo "not a deb"; exit 1; }
          dpkg-deb -f "$DEB" Architecture | grep -qx amd64
          mkdir -p out
          cp "$DEB" "out/GozarWG-${VERSION}-Linux-amd64.deb"

      - name: Smoke test
        run: |
          set -e
          APP=$(ls -d desktop/build/compose/binaries/main/app/GozarWG | head -1)
          "$APP/bin/GozarWG" --version
          "$APP/bin/GozarWG" --selftest | tee "$RUNNER_TEMP/selftest.txt"
          grep -q "ALL OK" "$RUNNER_TEMP/selftest.txt"
          "$APP/bin/GozarWG" --proxy-test | tee "$RUNNER_TEMP/proxy.txt"
          grep -q "ALL OK" "$RUNNER_TEMP/proxy.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX
        shell: pwsh
        run: |
          $wix = "C:\Program Files (x86)\WiX Toolset v3.14"
          if (-not (Test-Path "$wix\bin\light.exe")) { choco install wixtoolset -y --no-progress }
          if (-not (Test-Path "$wix\bin\light.exe")) { throw "light.exe is missing" }

      - name: Package
        shell: bash
        run: bash ./gradlew :desktop:createDistributable :desktop:packageMsi --no-daemon --stacktrace

      - name: Verify installer platform
        shell: pwsh
        run: |
          $msi = (Get-ChildItem "desktop\build\compose\binaries\main\msi\*.msi" | Select-Object -First 1).FullName
          Write-Host "installer: $msi"
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $installer, @($msi, 0))
          $summary = $db.GetType().InvokeMember("SummaryInformation", "GetProperty", $null, $db, @(0))
          $template = $summary.GetType().InvokeMember("Property", "GetProperty", $null, $summary, @(7))
          $product = $summary.GetType().InvokeMember("Property", "GetProperty", $null, $summary, @(3))
          Write-Host "template=$template product=$product"
          if ("$template" -notlike "x64*") { throw "the installer platform is $template" }
          if ("$product" -notlike "1.6.*") { throw "the installer version is $product" }

      - name: Verify packed binaries
        shell: bash
        run: |
          set -e
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/arch_check.py desktop/build/compose/binaries/main/app x86_64

      - name: Collect
        shell: bash
        run: |
          set -e
          VERSION=$(grep -m1 'packageVersion' desktop/build.gradle | sed -E "s/.*'([^']+)'.*/\1/" | tr -d ' ')
          MSI=$(ls desktop/build/compose/binaries/main/msi/*.msi | head -1)
          mkdir -p out
          cp "$MSI" "out/GozarWG-${VERSION}-Windows-x64.msi"
          ls -l out

      - name: Smoke test
        shell: bash
        run: |
          set -e
          APP=$(ls -d desktop/build/compose/binaries/main/app/GozarWG | head -1)
          "$APP/GozarWG.exe" --version

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            label: Intel
          - runner: macos-15
            arch: arm64
            label: ARM
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Package
        run: bash ./gradlew :desktop:packageDmg --no-daemon --stacktrace

      - name: Verify architecture
        run: |
          set -e
          VERSION=$(grep -m1 'packageVersion' desktop/build.gradle | sed -E "s/.*'([^']+)'.*/\1/" | tr -d ' ')
          DMG=$(ls desktop/build/compose/binaries/main/dmg/*.dmg | head -1)
          python3 scripts/arch_check.py desktop/build/compose/binaries/main/app ${{ matrix.arch }}
          MOUNT="$RUNNER_TEMP/mount"
          rm -rf "$MOUNT" && mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -quiet
          python3 scripts/arch_check.py "$MOUNT" ${{ matrix.arch }}
          hdiutil detach "$MOUNT" -quiet
          mkdir -p out
          cp "$DMG" "out/GozarWG-${VERSION}-macOS-${{ matrix.label }}.dmg"

      - name: Smoke test
        run: |
          set -e
          APP=$(ls -d desktop/build/compose/binaries/main/app/GozarWG.app | head -1)
          "$APP/Contents/MacOS/GozarWG" --version
          "$APP/Contents/MacOS/GozarWG" --selftest | tee "$RUNNER_TEMP/selftest.txt"
          grep -q "ALL OK" "$RUNNER_TEMP/selftest.txt"
          "$APP/Contents/MacOS/GozarWG" --proxy-test | tee "$RUNNER_TEMP/proxy.txt"
          grep -q "ALL OK" "$RUNNER_TEMP/proxy.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.label }}
          path: out/*

  publish:
    needs: [android, linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true

      - name: Version
        id: version
        run: |
          set -e
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/" | tr -d ' ')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          ls -l collected

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is missing"
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/gpg.asc"
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import "$RUNNER_TEMP/gpg.asc"
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          gpg --armor --export "$FPR" > collected/gozarwg-public-key.asc

      - name: Sign every asset
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          cd collected
          for f in *.apk *.msi *.dmg *.deb; do
            [ -e "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --output "$f.sig" "$f"
          done
          ls -l

      - name: Drop old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KEEP="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" = "$KEEP" ]; then echo "keeping $tag"; continue; fi
            echo "removing $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
          git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}' | while read -r tag; do
            if [ "$tag" = "$KEEP" ]; then continue; fi
            echo "removing tag $tag"
            git push origin ":refs/tags/$tag" || true
          done

      - name: Notes
        run: python3 scripts/notes.py "${{ steps.version.outputs.value }}" "${{ github.repository }}" > "$RUNNER_TEMP/notes.md"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          name: ${{ format('GozarWG {0}', steps.version.outputs.value) }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: true
          files: collected/*
          fail_on_unmatched_files: true
