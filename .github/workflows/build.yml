name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Gozar

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is missing - refusing to build an unsigned release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          set -e
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/" | tr -d ' ')
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" .apk)
            case "$b" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *x86*) abi=x86 ;;
              *universal*) abi=universal ;;
              *) abi=universal ;;
            esac
            cp "$f" "out/Gozar_${VERSION}_${abi}.apk"
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            name: linux
          - os: windows-latest
            goos: windows
            name: windows
          - os: macos-15
            goos: darwin
            name: macos

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go-desktop/go.sum

      - name: Vet
        working-directory: go-desktop
        shell: bash
        run: go vet ./...

      - name: Build
        working-directory: go-desktop
        shell: bash
        run: |
          set -e
          mkdir -p out
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          GOOS=${{ matrix.goos }} CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "out/gozar-${{ matrix.name }}$ext" ./cmd/gozar-cli
          ls -l out
          echo "size: $(wc -c < "out/gozar-${{ matrix.name }}$ext") bytes"

      - name: Self test
        if: matrix.goos == 'linux'
        working-directory: go-desktop
        shell: bash
        run: ./out/gozar-linux --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: gozar-go-${{ matrix.name }}
          path: go-desktop/out/*

  godesk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            arch: amd64
            name: Linux-amd64
          - os: ubuntu-latest
            goos: linux
            arch: arm64
            name: Linux-arm64
          - os: windows-latest
            goos: windows
            arch: amd64
            name: Windows-x64
          - os: macos-15
            goos: darwin
            arch: arm64
            name: macOS-ARM
          - os: macos-15-intel
            goos: darwin
            arch: amd64
            name: macOS-Intel

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go-desktop/go.sum

      - name: Vet
        working-directory: go-desktop
        shell: bash
        run: go vet ./...

      - name: Build
        working-directory: go-desktop
        shell: bash
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -e
          mkdir -p out
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o "out/Gozar-${{ matrix.name }}$ext" ./cmd/gozar
          ls -l out

      - name: Self test
        if: matrix.goos == 'linux' && matrix.arch == 'amd64'
        working-directory: go-desktop
        shell: bash
        run: ./out/Gozar-Linux-amd64 --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: gozar-${{ matrix.name }}
          path: go-desktop/out/*

  publish:
    needs: [android, godesk]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: collected
          merge-multiple: true

      - name: Version
        id: version
        run: |
          set -e
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/" | tr -d ' ')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          ls -l collected

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY is missing"
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/gpg.asc"
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --import "$RUNNER_TEMP/gpg.asc"
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          gpg --armor --export "$FPR" > collected/gozar-public-key.asc

      - name: Sign every asset
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          cd collected
          for f in *.apk *.exe Gozar-*; do
            [ -e "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --output "$f.sig" "$f"
          done
          ls -l

      - name: Drop old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KEEP="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            if [ "$tag" = "$KEEP" ]; then echo "keeping $tag"; continue; fi
            echo "removing $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done
          git ls-remote --tags origin | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}' | while read -r tag; do
            if [ "$tag" = "$KEEP" ]; then continue; fi
            echo "removing tag $tag"
            git push origin ":refs/tags/$tag" || true
          done

      - name: Notes
        run: python3 scripts/notes.py "${{ steps.version.outputs.value }}" "${{ github.repository }}" > "$RUNNER_TEMP/notes.md"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.value) }}
          name: ${{ format('Gozar {0}', steps.version.outputs.value) }}
          body_path: ${{ runner.temp }}/notes.md
          make_latest: true
          files: collected/*
          fail_on_unmatched_files: true
