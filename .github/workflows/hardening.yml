name: Hardening

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-15-intel
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: Vet
        working-directory: go-desktop
        shell: bash
        run: go vet ./...
      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: go-desktop
        shell: bash
        run: go test ./...
      - name: Iran UDP WARP settings policy tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: go-desktop
        shell: bash
        run: go test -count=1 -v ./internal/config ./internal/geo ./internal/warp ./internal/settings
      - name: Cross compile
        working-directory: go-desktop
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Windows live Wintun and WFP smoke
        if: matrix.goos == 'windows'
        working-directory: go-desktop
        shell: pwsh
        run: |
          go test -c -o "$env:RUNNER_TEMP/gozar-live.test.exe" ./internal/engine
          $env:GOZAR_LIVE_TUN_TEST = '1'
          $env:GOZAR_PROTECT_TEST_IP = '203.0.113.42'
          & "$env:RUNNER_TEMP/gozar-live.test.exe" '-test.v' '-test.run=^TestLiveKernelTunnel$' '-test.timeout=75s'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux nftables syntax
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables
          go -C go-desktop run ./cmd/gozar-nft > "$RUNNER_TEMP/gozar.nft"
          sudo mkdir -p /sys/fs/cgroup/system.slice/gozar.service
          sudo nft -c -f "$RUNNER_TEMP/gozar.nft"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Core network tests
        run: bash scripts/gradle_retry.sh :core:test --no-daemon --max-workers=2
      - name: App unit tests
        run: bash scripts/gradle_retry.sh :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --max-workers=2

  reproducible-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: Build twice
        working-directory: go-desktop
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          SOURCE_DATE_EPOCH: '1700000000'
        run: |
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o /tmp/gozar-core-a ./cmd/gozar
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o /tmp/gozar-core-b ./cmd/gozar
          cmp /tmp/gozar-core-a /tmp/gozar-core-b
          sha256sum /tmp/gozar-core-a /tmp/gozar-core-b
