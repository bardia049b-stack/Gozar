name: Soak

# Long-running stability gate. A normal push never pays for this: it runs on a
# weekly schedule (15 minutes) and on demand for anything up to a full day.
#
# GitHub caps one job at 6 hours, so a 24-hour soak is run as sequential
# stages: minutes=350, stages=4 -> 4 x 350 min = 23 h 20 m of continuous load
# plus setup time. Each stage is a fresh process, which is what a user who
# leaves the app running overnight actually experiences.
on:
  # A short soak runs on every push so the stability gate itself is tested.
  # workflow_dispatch and the weekly schedule use the longer durations below.
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Load minutes per stage (max 350)'
        required: false
        default: '15'
      stages:
        description: 'Sequential stages (4 x 350 min ~ 24 h)'
        required: false
        default: '1'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
      minutes: ${{ steps.plan.outputs.minutes }}
    steps:
      - id: plan
        env:
          MINUTES: ${{ github.event.inputs.minutes || (github.event_name == 'push' && '5' || '15') }}
          STAGES: ${{ github.event.inputs.stages || '1' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          minutes = max(1, min(350, int(os.environ.get("MINUTES") or 15)))
          stages = max(1, min(8, int(os.environ.get("STAGES") or 1)))
          print(f"minutes={minutes}")
          print("stages=" + json.dumps(list(range(1, stages + 1))))
          PY
      - name: Plan summary
        run: |
          echo "### Soak plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- minutes per stage: ${{ steps.plan.outputs.minutes }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- stages: ${{ steps.plan.outputs.stages }}" >> "$GITHUB_STEP_SUMMARY"

  soak:
    needs: plan
    runs-on: ubuntu-latest
    # 350 minutes of load plus checkout, toolchain and reporting.
    timeout-minutes: 358
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        stage: ${{ fromJSON(needs.plan.outputs.stages) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: Raise UDP buffer limits for QUIC
        run: |
          sudo sysctl -w net.core.rmem_max=7500000 net.core.wmem_max=7500000 || true
      - name: Soak stage ${{ matrix.stage }}
        working-directory: go-desktop
        env:
          GOZAR_SOAK_MINUTES: ${{ needs.plan.outputs.minutes }}
        run: |
          set -o pipefail
          go test ./internal/engine -run TestSoak -count=1 -v \
            -timeout "$((GOZAR_SOAK_MINUTES + 5))m" 2>&1 | tee "soak-stage-${{ matrix.stage }}.log"
      - name: Stage summary
        if: always()
        working-directory: go-desktop
        run: |
          {
            echo "### Soak stage ${{ matrix.stage }}"
            echo '```'
            grep -E 'floor=|soak finished|outage|FAIL|PASS' "soak-stage-${{ matrix.stage }}.log" | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-stage-${{ matrix.stage }}
          path: go-desktop/soak-stage-${{ matrix.stage }}.log
          if-no-files-found: warn
