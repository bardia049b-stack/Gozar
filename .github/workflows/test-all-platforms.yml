name: Test All Platforms

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-all-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: Vet
        working-directory: go-desktop
        run: go vet ./...
      - name: Core tests
        working-directory: go-desktop
        run: go test ./...
      - name: Isolated UDP WARP WebRTC gaming geo tests
        working-directory: go-desktop
        run: go test -count=1 -v ./internal/packet ./internal/warp ./internal/warptest ./internal/rtctest ./internal/geo ./internal/bypass
      - name: Iran settings policy
        working-directory: go-desktop
        run: go test -count=1 -v ./internal/config ./internal/settings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-logs
          path: go-desktop/**/*.log
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: Core tests
        working-directory: go-desktop
        run: go test ./...
      - name: WFP tests
        working-directory: go-desktop
        env:
          GOZAR_LIVE_WFP: '1'
        run: go test -count=1 -v ./internal/tunnel/... -run TestWFP

  macos:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: Core tests
        working-directory: go-desktop
        run: go test ./...
      - name: PF tests
        working-directory: go-desktop
        run: go test -count=1 -v ./internal/killswitch/... -run TestPF

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: Build the Go core for Android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash scripts/build_android_core.sh
      - name: Test the Go core binding
        working-directory: go-desktop
        run: go test ./mobile/... ./internal/protect/...
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Core and app tests
        run: bash scripts/gradle_retry.sh :core:test :app:testDebugUnitTest --no-daemon --max-workers=2

  openwrt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: Cross compile and package OpenWrt
        env:
          GOZAR_OPENWRT_X86_64: '1'
        run: |
          mkdir -p packaging/openwrt/out
          bash scripts/package_openwrt.sh 1.10.3 packaging/openwrt/out
      - name: Official OpenWrt rootfs Docker test
        run: |
          docker build -f packaging/openwrt/Dockerfile -t gozar-openwrt-test packaging/openwrt
          docker run --rm --privileged gozar-openwrt-test
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-ipk
          path: packaging/openwrt/out/*.ipk
          if-no-files-found: error

  bypass:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: DPI simulation and advanced bypass tests
        working-directory: go-desktop
        run: go test -count=1 -v ./internal/bypass ./internal/tunnel ./internal/dnsproxy ./internal/warp

  dpi-toxiproxy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: Start toxiproxy
        run: |
          docker run -d --name toxiproxy --network host shopify/toxiproxy:latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8474/version >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs toxiproxy
          exit 1
      - name: DPI/toxiproxy transport test
        working-directory: go-desktop
        env:
          GOZAR_TOXIPROXY_API: http://127.0.0.1:8474
        run: go test -count=1 -v ./internal/bypass -run Toxiproxy
      - name: Fragment/padding/jitter through a sliced hostile path
        working-directory: go-desktop
        env:
          GOZAR_TOXIPROXY_API: http://127.0.0.1:8474
        run: go test -count=1 -v -timeout 10m ./internal/tunnel -run Toxiproxy
      - name: Stop toxiproxy
        if: always()
        run: docker rm -f toxiproxy || true

  data-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: 10 MB wire budget, retransmission rate and keep-alive reuse
        working-directory: go-desktop
        env:
          GOZAR_RETRANSMIT_GATE: '1'
        run: go test -count=1 -v -timeout 15m ./internal/engine -run 'WireBudget|RepeatedSmall|TenMegabyte'
      - name: DNS cache floor, negative caching and single-flight
        working-directory: go-desktop
        run: go test -count=1 -v ./internal/dnsproxy
      - name: Network drop and reconnect recovery
        working-directory: go-desktop
        run: go test -count=1 -v -timeout 10m ./internal/engine -run Recover

  live-warp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: WARP against the real Cloudflare endpoint
        working-directory: go-desktop
        env:
          GOZAR_LIVE_WARP: '1'
          GOZAR_WARP_ENDPOINT: 162.159.198.2:443
        run: go test -count=1 -v -timeout 10m ./internal/warp -run LiveWarp

  kill-switch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-desktop/go.mod
          cache-dependency-path: go-desktop/go.sum
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Rule syntax and guard unit tests
        working-directory: go-desktop
        run: sudo -E env "PATH=$PATH" go test -count=1 -v ./internal/killswitch
      - name: Crash leaves the network cut, restart restores it
        run: sudo bash scripts/killswitch_crash_test.sh

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Inspect Flutter code
        working-directory: desktop_flutter
        run: |
          flutter pub get
          flutter analyze
      - name: Interface tests
        working-directory: desktop_flutter
        run: flutter test --reporter expanded

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android, openwrt, bypass, dpi-toxiproxy, data-budget, live-warp, kill-switch, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openwrt-ipk
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.ipk
          generate_release_notes: true
