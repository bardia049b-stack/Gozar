plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def goCoreAar = rootProject.file('core/libs/gozar-core.aar')
def hasGoCore = goCoreAar.exists()
def keystoreFile = System.getenv('KEYSTORE_FILE')
def hasSigning = keystoreFile != null && !keystoreFile.isEmpty() && file(keystoreFile).exists()

android {
    namespace 'com.gozar'
    compileSdk 36

    defaultConfig {
        applicationId 'com.gozar'
        minSdk 24
        targetSdk 35
        versionCode 36
        versionName '1.10.4'
        manifestPlaceholders.appLabel = '@string/app_name'
        manifestPlaceholders.xiaomiAppId = System.getenv('XIAOMI_APP_ID') ?: ''
        manifestPlaceholders.xiaomiDebug = 'false'
        if (project.hasProperty('gozarDiagnostic')) {
            applicationIdSuffix '.diagnostic'
            versionNameSuffix '-test'
            manifestPlaceholders.appLabel = 'Gozar Test'
        }
        resourceConfigurations += ['en', 'fa']
        buildConfigField 'boolean', 'GO_CORE', hasGoCore ? 'true' : 'false'
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
                storeType 'PKCS12'
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasSigning ? signingConfigs.release : null
        }
        debug {
            manifestPlaceholders.xiaomiDebug = 'true'
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '384m'
            jvmArgs '--add-opens=java.base/java.net=ALL-UNNAMED'
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation project(':core')
    if (hasGoCore) {
        implementation files(goCoreAar)
    }
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.graphics:graphics-shapes:1.1.0'
    implementation 'com.google.android.material:material:1.13.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
