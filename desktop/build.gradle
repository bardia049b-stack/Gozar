plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.compose'
    id 'org.jetbrains.kotlin.plugin.compose'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation project(':core')
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation compose.desktop.currentOs
    implementation compose.material3
    implementation 'org.json:json:20240303'
}

compose.desktop {
    application {
        mainClass = 'com.gozar.desk.MainKt'


        nativeDistributions {
            targetFormats(
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Deb,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Dmg
            )
            modules(
                'java.base',
                'java.desktop',
                'java.logging',
                'java.management',
                'java.naming',
                'java.prefs',
                'java.security.jgss',
                'java.instrument',
                'jdk.crypto.ec',
                'jdk.unsupported'
            )
            packageName = 'Gozar'
            packageVersion = '1.8.1'
            description = 'Gozar desktop'
            vendor = 'Gozar'

            linux {
                menuGroup = 'Network'
                appCategory = 'Network'
                debMaintainer = 'dev@gozar.local'
                iconFile.set(file('icons/gozar-256.png'))
            }

            windows {
                menuGroup = 'Gozar'
                upgradeUuid = '8f9f0b34-4cb6-4b6a-9a2e-6c4f1e8a6d51'
                iconFile.set(file('icons/gozar.ico'))
            }

            macOS {
                bundleID = 'com.gozar.desktop'
                dockName = 'Gozar'
                iconFile.set(file('icons/gozar.icns'))
            }
        }
    }
}
