<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gozar</title>
<style>
:root{--dark:#600015;--mid:#c41434;--soft:#ee6e85;--light:#fe966e;--bg:#121318;--card:#1b1d24;--text:#f7e9ee;--dim:#a99aa2}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#2a1019 0%,var(--bg) 55%);color:var(--text);font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:420px;padding:22px 18px 34px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--dim);display:block;margin-top:2px}
.card{background:linear-gradient(160deg,var(--mid),var(--dark));border-radius:26px;padding:22px 18px;text-align:center;box-shadow:0 18px 44px rgba(0,0,0,.45)}
.card.off{background:linear-gradient(160deg,#2b2f3a,#1a1d24);box-shadow:none}
.power{width:104px;height:104px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto;transition:.25s;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.power:hover{background:rgba(255,255,255,.22)}
.power.on{background:#fff;color:var(--mid);box-shadow:0 0 0 10px rgba(255,255,255,.14)}
.power.busy{opacity:.65;pointer-events:none}
.status{margin-top:14px;font-size:17px;font-weight:700}
.sub{font-size:12.5px;color:#ffd9e2;margin-top:4px;min-height:18px}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.22);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:0;border-radius:6px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--card);border-radius:16px;padding:12px 14px}
.tile b{display:block;font-size:15px;margin-top:3px;font-weight:600}
.tile span{font-size:11.5px;color:var(--dim)}
.row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:13px 15px;margin-top:10px;gap:10px}
.row label{font-size:11.5px;color:var(--dim);display:block}
.row select,.row input{width:100%;background:#242732;color:var(--text);border:0;border-radius:10px;padding:9px 10px;font-size:13.5px;font-family:inherit;margin-top:6px;outline:none}
.fault{background:#4a1020;color:#ffc9d6;border-radius:14px;padding:11px 13px;font-size:12.5px;margin-top:12px;line-height:1.7}
.btn{border:0;border-radius:14px;padding:13px;width:100%;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;background:linear-gradient(120deg,var(--light),var(--mid));color:#fff;margin-top:12px}
.btn.ghost{background:#242732;color:var(--text)}
.btn:disabled{opacity:.55;cursor:default}
.hidden{display:none}
a.link{color:var(--soft);font-size:12.5px;text-decoration:none;cursor:pointer}
.foot{text-align:center;color:var(--dim);font-size:11.5px;margin-top:18px;line-height:1.9}
.mono{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
      <circle cx="19" cy="19" r="18" fill="#c41434"/>
      <path d="M19 7c6 0 10 4 10 9 0 3-1 5-3 6 1-3 0-6-3-7-4-2-9 1-9 6 0 4 3 7 7 7 3 0 5-1 6-3h-4v-3h9v4c-1 4-5 7-10 7-7 0-12-5-12-12 0-7 6-14 12-14z" fill="#f7e9ee"/>
    </svg>
    <div>
      <h1>Gozar</h1>
      <span id="who">خارج از حساب</span>
    </div>
  </div>

  <div class="card off" id="card">
    <button class="power" id="power">اتصال</button>
    <div class="status" id="status">قطع</div>
    <div class="sub" id="sub">۵۰ گیگابایت رایگان در ماه</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="sub" id="usage">با حساب فایرفاکس وارد شوید</div>
  </div>

  <div id="fault" class="fault hidden"></div>

  <div class="grid">
    <div class="tile"><span>دانلود</span><b class="mono" id="down">0</b></div>
    <div class="tile"><span>آپلود</span><b class="mono" id="up">0</b></div>
    <div class="tile"><span>سرور</span><b id="srv">—</b></div>
    <div class="tile"><span>IP خروجی</span><b class="mono" id="exit">—</b></div>
  </div>

  <div class="row">
    <div style="flex:1">
      <label>سرور</label>
      <select id="servers"></select>
    </div>
  </div>

  <div class="row">
    <div style="flex:1">
      <label>حالت اتصال</label>
      <select id="mode">
        <option value="tun">تونل کامل (همه برنامه‌ها)</option>
        <option value="proxy">پروکسی سیستم</option>
      </select>
    </div>
  </div>

  <div id="loginBox" class="hidden">
    <div class="row"><div style="flex:1"><label>ایمیل فایرفاکس</label><input id="email" type="email" dir="ltr" autocomplete="username"></div></div>
    <div class="row"><div style="flex:1"><label>رمز</label><input id="password" type="password" dir="ltr" autocomplete="current-password"></div></div>
    <div class="row hidden" id="codeRow"><div style="flex:1"><label>کد تأیید ایمیل</label><input id="code" dir="ltr" inputmode="numeric"></div></div>
    <button class="btn" id="loginBtn">ورود</button>
  </div>

  <button class="btn ghost hidden" id="logoutBtn">خروج از حساب</button>

  <div class="foot">
    <span id="modeNote">تونل کامل به دسترسی مدیر نیاز دارد</span><br>
    <span id="ver"></span>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let state = null, needsCode = false, busy = false;

function bytes(value){
  if (!value) return '0';
  const units = ['B','KB','MB','GB','TB'];
  let index = 0, number = value;
  while (number >= 1024 && index < units.length - 1){ number /= 1024; index++; }
  return number.toFixed(number < 10 && index > 0 ? 1 : 0) + ' ' + units[index];
}

function paint(data){
  const s = data.state;
  state = s;
  $('who').textContent = s.signed_in ? s.email : 'خارج از حساب';
  $('ver').textContent = 'Gozar ' + s.version + (s.admin ? '' : ' · بدون دسترسی مدیر');

  const power = $('power');
  power.className = 'power' + (s.live ? ' on' : '') + (busy ? ' busy' : '');
  power.textContent = busy || s.connecting ? '…' : (s.live ? 'قطع' : 'اتصال');
  $('status').textContent = s.connecting ? 'در حال اتصال…' : (s.live ? 'متصل' : 'قطع');
  $('card').className = 'card' + (s.live ? '' : ' off');
  $('sub').textContent = s.stage || (s.live ? (s.mode === 'tun' ? 'همه برنامه‌ها از تونل می‌گذرند' : 'پروکسی سیستم فعال است') : '۵۰ گیگابایت رایگان در ماه');

  if (s.limit > 0){
    const used = Math.max(s.limit - s.remaining, 0);
    $('bar').style.width = Math.min(100, used / s.limit * 100) + '%';
    $('usage').textContent = bytes(used) + ' از ' + bytes(s.limit) + ' مصرف شده' + (s.reset ? ' · بازنشانی ' + s.reset : '');
  } else {
    $('bar').style.width = '0';
    $('usage').textContent = s.signed_in ? 'سهمیه نامحدود' : 'با حساب فایرفاکس وارد شوید';
  }

  $('down').textContent = bytes(data.rate_down) + '/s';
  $('up').textContent = bytes(data.rate_up) + '/s';
  $('srv').textContent = s.server && s.server.code ? (s.server.city || s.server.country || s.server.code) : '—';
  $('exit').textContent = s.exit || '—';

  const box = $('fault');
  if (s.fault){
    box.classList.remove('hidden');
    box.textContent = s.fault + (s.needs_admin ? ' · برنامه را با دسترسی مدیر اجرا کنید' : '');
  } else {
    box.classList.add('hidden');
  }

  if (s.servers && s.servers.length && $('servers').options.length !== s.servers.length){
    const select = $('servers');
    select.innerHTML = '';
    for (const place of s.servers){
      const option = document.createElement('option');
      option.value = place.code;
      option.textContent = place.code + ' · ' + (place.country || '') + (place.city ? ' · ' + place.city : '');
      select.appendChild(option);
    }
    select.value = s.server && s.server.code ? s.server.code : select.value;
  }

  $('mode').value = s.mode;
  $('loginBox').classList.toggle('hidden', s.signed_in);
  $('logoutBtn').classList.toggle('hidden', !s.signed_in);
  $('codeRow').classList.toggle('hidden', !needsCode);
}

async function refresh(){
  try {
    const data = await (await fetch('/api/state')).json();
    paint(data);
  } catch (e) {}
}

async function post(path, body){
  const options = body ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : { method:'POST' };
  return (await fetch(path, options)).json();
}

$('power').onclick = async () => {
  busy = true; refresh();
  const s = state;
  const result = s && s.live ? await post('/api/disconnect') : await post('/api/connect');
  busy = false;
  if (result.error){ $('fault').classList.remove('hidden'); $('fault').textContent = result.error; }
  refresh();
};

$('loginBtn').onclick = async () => {
  const email = $('email').value.trim(), password = $('password').value, code = $('code').value.trim();
  if (!email || !password) return;
  $('loginBtn').disabled = true; $('loginBtn').textContent = 'در حال ورود…';
  const result = await post('/api/login', { email, password, code });
  $('loginBtn').disabled = false; $('loginBtn').textContent = 'ورود';
  if (result.error){
    needsCode = !!result.needs_code || /code/i.test(result.error);
    $('fault').classList.remove('hidden');
    $('fault').textContent = needsCode ? 'کد تأیید را از ایمیل وارد کنید' : result.error;
  } else {
    needsCode = false; $('password').value = ''; $('code').value = '';
    $('fault').classList.add('hidden');
    await fetch('/api/servers').catch(() => {});
    await fetch('/api/usage', { method:'POST' }).catch(() => {});
  }
  refresh();
};

$('logoutBtn').onclick = async () => { await post('/api/logout'); refresh(); };
$('servers').onchange = () => fetch('/api/server?code=' + encodeURIComponent($('servers').value), { method:'POST' });
$('mode').onchange = () => fetch('/api/mode?mode=' + encodeURIComponent($('mode').value), { method:'POST' });
$('modeNote').textContent = 'حالت پروکسی بدون دسترسی مدیر هم کار می‌کند';

refresh();
fetch('/api/servers').catch(() => {});
setInterval(refresh, 1200);
</script>
</body>
</html>
